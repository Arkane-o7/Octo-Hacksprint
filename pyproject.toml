[project]
name = "octo-demo"
version = "0.1.0"
description = "A small WhatsApp school assistant powered by Sarvam"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "sqlcipher3-wheels==0.5.7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

